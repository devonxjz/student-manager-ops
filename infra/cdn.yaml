AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Student Manager - CloudFront truoc ALB de co HTTPS bang domain *.cloudfront.net.
  Stack: sms-dev-cdn. Deploy sau sms-dev-app; ten ALB lay tu output ApplicationUrl
  (xem infra/README.md). Doan CloudFront -> ALB van la HTTP.

Parameters:
  AlbDnsName:
    Type: String
    Description: DNS cua ALB, khong co http://

Resources:
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: sms-dev - HTTPS cho Student Manager
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: false
        PriceClass: PriceClass_100 # chi Bac My va chau Au, re nhat
        Origins:
          - Id: alb
            DomainName: !Ref AlbDnsName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only # ALB chua co chung chi
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          Compress: true
          # Managed-CachingDisabled: ung dung co dang nhap nen khong cache
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewer: chuyen cookie, header, query string toi ALB
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

Outputs:
  HttpsUrl:
    Value: !Sub https://${Distribution.DomainName}
    Description: Dia chi HTTPS cua ung dung
  DistributionId:
    Value: !Ref Distribution
